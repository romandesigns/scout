name: Scout CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Backend tests
        env:
          DATA_DIR: ${{ runner.temp }}/scout-data
          CHART_DIR: ${{ runner.temp }}/scout-charts
          WEB_OUT_DIR: ${{ runner.temp }}/scout-web
        run: python -m unittest discover -s tests -v

      - name: Offline replay smoke test
        env:
          DATA_DIR: ${{ runner.temp }}/scout-data
          CHART_DIR: ${{ runner.temp }}/scout-charts
          WEB_OUT_DIR: ${{ runner.temp }}/scout-web
        run: python -m scripts.run_replay tests/fixtures/replay-smoke.ndjson --output ${{ runner.temp }}/scout-replays

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: web
        run: bun run typecheck

      - name: Frontend build
        working-directory: web
        run: bun run build
