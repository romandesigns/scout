services:
  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    container_name: stockhunter-ntfy
    command:
      - serve
      - --cache-file
      - /var/cache/ntfy/cache.db
    restart: unless-stopped
    init: true
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    ports:
      - "127.0.0.1:18082:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scout:
    build: .
    container_name: stockhunter-scout
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./charts:/charts
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
