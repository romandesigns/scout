services:
  scout:
    build: .
    container_name: stockhunter-scout
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./charts:/charts
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
